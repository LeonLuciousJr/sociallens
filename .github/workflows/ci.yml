name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Audit backend dependencies
        working-directory: backend
        run: uv export --frozen --no-hashes --format requirements-txt | uvx pip-audit -r /dev/stdin

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  lint:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-lint-secret-key
      DJANGO_DEBUG: "False"
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv & Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run Django system checks
        working-directory: backend
        run: uv run python manage.py check

      - name: Check backend syntax and undefined names
        working-directory: backend
        run: uvx ruff check .

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sociallens
          POSTGRES_PASSWORD: sociallens
          POSTGRES_DB: sociallens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "False"
      DB_NAME: sociallens_test
      DB_USER: sociallens
      DB_PASSWORD: sociallens
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv & Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Apply database migrations
        working-directory: backend
        run: uv run python manage.py migrate --noinput

      - name: Run tests
        working-directory: backend
        run: uv run pytest

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - working-directory: frontend
        run: npm run coverage

      - working-directory: frontend
        run: npm run build

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  prepare-deployment-artifact:
    runs-on: ubuntu-latest
    needs: [dependency-audit, lint, backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, tag and push the image to GHCR
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sociallens-backend:${GITHUB_SHA}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"