name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Build the backend Docker image
        run: docker build -t sociallens-backend:ci ./backend

      - name: Confirm the image was built
        run: docker image inspect sociallens-backend:ci --format 'Built {{.Id}} ({{.Architecture}}, {{.Size}} bytes)'